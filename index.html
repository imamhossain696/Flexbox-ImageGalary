<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Galary</title>
    <link rel="stylesheet" href="style.css">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
    />
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <h4>Photo Albams</h4>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Galary</li>
                <li>Wallpaper</li>
                <li>About Us</li>
            </ul>
        </div>
        <div class="card-galary">
            <div class="card-temp">
                <div>
                    <img src="./asset/nature1.jpg" alt="">
                </div>
                <ul>
                    <li>
                        <img src="./asset/nature2.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/nature3.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/nature4.jpg" alt="">
                    </li>
                </ul>
                <div class="caption">
                    <p>Nature</p>
                    <span>
                        <i class="ph ph-image"></i>
                        <small>3K</small>
                    </span>
                </div>
            </div>
            <div class="card-temp">
                <div>
                    <img src="./asset/animal1.jpg" alt="">
                </div>
                <ul>
                    <li>
                        <img src="./asset/animal2.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/animal3.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/animal4.jpg" alt="">
                    </li>
                </ul>
                <div class="caption">
                    <p>Animals</p>
                    <span>
                        <i class="ph ph-image"></i>
                        <small>1.8K</small>
                    </span>
                </div>
            </div>
            <div class="card-temp">
                <div>
                    <img src="./asset/flower1.jpg" alt="">
                </div>
                <ul>
                    <li>
                        <img src="./asset/flower2.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/flower3.jpg" alt="">
                    </li>
                    <li>
                        <img src="./asset/flower4.jpg" alt="">
                    </li>
                </ul>
                <div class="caption">
                    <p>Flowers</p>
                    <span>
                        <i class="ph ph-image"></i>
                        <small>3.4K</small>
                    </span>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
